# DO NOT commit a real key here.
# Before applying, either:
#   1. Replace the placeholder below and apply once, then revert this file, OR
#   2. Create the secret directly: kubectl create secret generic heal-ai-secrets \
#        --from-literal=ANTHROPIC_API_KEY=sk-ant-... -n heal-ai
apiVersion: v1
kind: Secret
metadata:
  name: heal-ai-secrets
  namespace: heal-ai
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
